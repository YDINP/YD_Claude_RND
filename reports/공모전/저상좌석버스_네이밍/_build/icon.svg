<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect x="40" y="40" width="920" height="920" rx="200" fill="#0E6BA8"/>
  <!-- long-distance arrow -->
  <path d="M220 185 H740" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M708 145 L770 185 L708 225" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wheels behind body: low floor -->
  <circle cx="280" cy="700" r="56" fill="#12324A"/><circle cx="280" cy="700" r="20" fill="#ffffff"/>
  <circle cx="790" cy="700" r="56" fill="#12324A"/><circle cx="790" cy="700" r="20" fill="#ffffff"/>
  <!-- body -->
  <rect x="140" y="255" width="730" height="435" rx="70" fill="#ffffff"/>
  <path d="M800 290 a50 50 0 0 1 45 50 v140 h-55 z" fill="#CFE6F5"/>
  <rect x="180" y="305" width="380" height="190" rx="28" fill="#CFE6F5"/>
  <!-- seated person -->
  <circle cx="275" cy="360" r="30" fill="#0E6BA8"/>
  <rect x="226" y="398" width="16" height="86" rx="8" fill="#0E6BA8"/>
  <path d="M244 400 h52 a12 12 0 0 1 12 12 v46 h44 a12 12 0 0 1 12 12 v14 h-120 z" fill="#0E6BA8"/>
  <!-- wheelchair user side by side -->
  <circle cx="455" cy="360" r="30" fill="#F2A900"/>
  <path d="M424 400 h50 a12 12 0 0 1 12 12 v44 h46 v26 h-108 z" fill="#F2A900"/>
  <circle cx="450" cy="468" r="36" fill="none" stroke="#F2A900" stroke-width="13"/>
  <!-- wide door between wheels, down to floor -->
  <rect x="600" y="305" width="110" height="385" rx="14" fill="#CFE6F5"/>
  <line x1="655" y1="312" x2="655" y2="690" stroke="#0E6BA8" stroke-width="6" opacity=".45"/>
  <!-- ramp: door floor to curb, nearly flat -->
  <path d="M600 690 H710 L742 760 H568 Z" fill="#F2A900"/>
  <!-- curb / ground line -->
  <path d="M100 760 H900" stroke="#F2A900" stroke-width="22" stroke-linecap="round"/>
  <text x="500" y="885" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic" font-weight="900" font-size="104" fill="#ffffff" letter-spacing="6">나란히버스</text>
</svg>
