<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1086px;height:1448px;overflow:hidden;background:#0a1438}
.wrap{position:relative;width:1086px;height:1448px;background:url(gen/tiger_0.png) center/cover}
.top{position:absolute;left:0;right:0;top:70px;text-align:center;color:#fff}
.kicker{font:700 26px 'Noto Sans KR';letter-spacing:6px;color:#f4b860;margin-bottom:20px}
.h{font:400 112px 'Black Han Sans';letter-spacing:2px;line-height:1.05;text-shadow:0 6px 24px rgba(0,0,0,.55)}
.h em{font-style:normal;color:#ffcf7a}
.sub{margin-top:22px;font:700 31px 'Noto Sans KR';color:#e8ecff;letter-spacing:.5px}
.sub b{color:#ffcf7a}
.bot{position:absolute;left:0;right:0;bottom:0;padding:120px 56px 46px;background:linear-gradient(transparent,rgba(5,10,30,.92) 45%);color:#fff}
.old{font:700 30px 'Noto Serif KR';color:#9aa6c8;text-decoration:line-through;text-decoration-color:#e4574a;text-decoration-thickness:3px}
.new{font:900 42px 'Noto Serif KR';margin-top:6px}
.new b{color:#ffcf7a}
.tip{display:flex;align-items:center;gap:18px;margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.25)}
.tip .t1{font:900 26px 'Noto Sans KR';background:#ffcf7a;color:#141c3a;padding:8px 16px;border-radius:6px;white-space:nowrap}
.tip .t2{font:700 25px 'Noto Sans KR';color:#e8ecff;line-height:1.45}
.sig{position:absolute;right:56px;bottom:20px;font:400 15px 'Noto Sans KR';color:#7f8ab0}
</style></head><body><div class="wrap">
<div class="top">
 <div class="kicker">K-빌런의 21세기 서울 상륙 작전</div>
 <div class="h">“엄마야, <em>문 열어 봐</em>”</div>
 <div class="sub">해님달님 호랑이, 이제는 밀가루 대신 <b>AI 목소리</b>로 온다</div>
</div>
<div class="bot">
 <div class="old">떡 하나 주면 안 잡아먹지</div>
 <div class="new">송금 <b>한 번</b>이면 안 잡아먹지</div>
 <div class="tip"><span class="t1">손 말고, 번호</span><span class="t2">옛날엔 “손을 내밀어 봐” · 지금은 <b style="color:#ffcf7a">끊고, 엄마 번호로 다시 걸어 보기</b></span></div>
</div>
</div></body></html>
