<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SL;src:url("../../공고/SmileLasik.ttf")}@font-face{font-family:VC;src:url("../../공고/VisionCorrection.ttf")}
html,body{margin:0}body{width:1600px;height:1600px;background:#e9e4da;font-family:SL;color:#1d2433;position:relative;overflow:hidden}
.k{position:absolute;left:90px;top:70px;font-size:28px;letter-spacing:12px;color:#8a8f9c}

</style><script src="cloth.js"></script></head><body>
