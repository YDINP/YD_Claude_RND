<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head>
<body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" font-family="'Malgun Gothic',sans-serif"><rect width="1000" height="640" fill="#fff"/><text x="20" y="30" font-size="19" font-weight="700" fill="#1F4E79">주 행사장 배치 개념도 — 태평성대 경상감영공원(약 6.5만㎡)</text><rect x="40" y="60" width="920" height="470" rx="18" fill="#F3F7EE" stroke="#9DB58A" stroke-width="3"/><rect x="70" y="90" width="290" height="130" rx="10" fill="#E3ECF7" stroke="#fff" stroke-width="3"/><circle cx="92" cy="112" r="14" fill="#fff"/><text x="92" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">3</text><text x="114" y="118" font-size="16" font-weight="700" fill="#111">명주 이름표 공방 · 전시</text><text x="86" y="142" font-size="13" fill="#111">함창 명주 이름표</text><text x="86" y="161" font-size="13" fill="#111">국가중요농업유산 해설전(감영 건물)</text><rect x="380" y="90" width="260" height="130" rx="10" fill="#EDE7F6" stroke="#fff" stroke-width="3"/><circle cx="402" cy="112" r="14" fill="#fff"/><text x="402" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">5</text><text x="424" y="118" font-size="16" font-weight="700" fill="#111">마당 무대</text><text x="396" y="142" font-size="13" fill="#111">지역 예술인·청년 공연</text><text x="396" y="161" font-size="13" fill="#111">대형 가수 초청 없음</text><rect x="660" y="90" width="270" height="130" rx="10" fill="#E6F4EA" stroke="#fff" stroke-width="3"/><circle cx="682" cy="112" r="14" fill="#fff"/><text x="682" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">6</text><text x="704" y="118" font-size="16" font-weight="700" fill="#111">어린이 마당</text><text x="676" y="142" font-size="13" fill="#111">감 따기·걸기 놀이</text><text x="676" y="161" font-size="13" fill="#111">감물 들이기</text><rect x="70" y="235" width="170" height="135" rx="10" fill="#E3ECF7" stroke="#fff" stroke-width="3"/><circle cx="92" cy="257" r="14" fill="#fff"/><text x="92" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">7</text><text x="114" y="263" font-size="16" font-weight="700" fill="#111">자전거 거점</text><text x="86" y="287" font-size="13" fill="#111">감길 자전거</text><text x="86" y="306" font-size="13" fill="#111">출발·대여 300대</text><rect x="255" y="235" width="505" height="135" rx="10" fill="#FFF4D6" stroke="#fff" stroke-width="3"/><circle cx="277" cy="257" r="14" fill="#fff"/><text x="277" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">4</text><text x="299" y="263" font-size="16" font-weight="700" fill="#111">삼백 장터 · 삼백 밥상</text><text x="271" y="287" font-size="13" fill="#111">곶감·햅쌀·한우·오이 농가 직판 40</text><text x="271" y="306" font-size="13" fill="#111">지역 음식점 20 — 가격 사전 공개 · 다회용기 세척장</text><rect x="775" y="235" width="155" height="135" rx="10" fill="#F1F1F1" stroke="#fff" stroke-width="3"/><circle cx="797" cy="257" r="14" fill="#fff"/><text x="797" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">9</text><text x="819" y="263" font-size="16" font-weight="700" fill="#111">편의 · 쉼터</text><text x="791" y="287" font-size="13" fill="#111">화장실</text><text x="791" y="306" font-size="13" fill="#111">수유실 · 보온 쉼터</text><rect x="70" y="385" width="330" height="130" rx="10" fill="#FCE3D2" stroke="#fff" stroke-width="3"/><circle cx="92" cy="407" r="14" fill="#fff"/><text x="92" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">1</text><text x="114" y="413" font-size="16" font-weight="700" fill="#111">감 깎는 마당</text><text x="86" y="437" font-size="13" fill="#111">깎기 50면(100석, 천막 5동)</text><text x="86" y="456" font-size="13" fill="#111">감 선생님 100명 · 한 줄 = 감 10개</text><rect x="415" y="385" width="330" height="130" rx="10" fill="#E8772E" stroke="#fff" stroke-width="3"/><circle cx="437" cy="407" r="14" fill="#fff"/><text x="437" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">2</text><text x="459" y="413" font-size="16" font-weight="700" fill="#fff">축제 덕장 (야경)</text><text x="431" y="437" font-size="13" fill="#fff">가설 덕장 2동 60m×8m, 지붕·방충망</text><text x="431" y="456" font-size="13" fill="#fff">농가 전시분 + 그날 걸린 줄, 18~22시 조명</text><rect x="760" y="385" width="170" height="130" rx="10" fill="#F1F1F1" stroke="#fff" stroke-width="3"/><circle cx="782" cy="407" r="14" fill="#fff"/><text x="782" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4E79">8</text><text x="804" y="413" font-size="16" font-weight="700" fill="#111">안전본부</text><text x="776" y="437" font-size="13" fill="#111">의무실 · 미아</text><text x="776" y="456" font-size="13" fill="#111">인파 관제</text><defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14z" fill="#B5501A"/></marker></defs><path d="M 500 528 C 420 528, 360 524, 330 518" stroke="#B5501A" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M 395 400 L 418 400" stroke="#B5501A" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M 700 388 L 700 368" stroke="#B5501A" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="6.0" y="286" width="68" height="28" rx="6" fill="#1F4E79"/><text x="40" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">서문</text><rect x="500.0" y="516" width="120" height="28" rx="6" fill="#1F4E79"/><text x="560" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">정문(주출입)</text><rect x="926.0" y="286" width="68" height="28" rx="6" fill="#1F4E79"/><text x="960" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">동문</text><text x="560" y="572" text-anchor="middle" font-size="14" fill="#333">정문 앞 셔틀 정류장 ① 시내 순환 ② 덕장선 ③ 강변선 · 택시·장애인 승하차장</text><text x="20" y="612" font-size="12" fill="#6B7280">※ 존 구성과 상대 배치를 보인 개념도. 실제 위치·면적은 공원 현황 측량과 기존 행사(곶감축제·모자페스티벌) 배치 자료로 확정한다.</text><text x="20" y="630" font-size="12" fill="#6B7280">※ 한 방향 동선(점선 화살표): 정문 → ① 깎기 → ② 걸기(이름표 부착) → ④ 장터 → 동·서문 분산 퇴장. 무대(⑤)는 정문 반대편 안쪽에 두어 병목을 막는다.</text></svg></body></html>
